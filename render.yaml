services:
  - type: web
    name: ticketiq-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
